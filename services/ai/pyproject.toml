[project]
name = "aegis-ai"
version = "0.1.0"
description = "Aegis FastAPI AI, RAG, LangGraph, and FastMCP service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.1",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "ruff>=0.9.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
